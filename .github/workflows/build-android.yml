name: Android Build

on:
  push:
    branches: [ "android-native" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-app

    steps:
      - name: 检出代码库
        uses: actions/checkout@v4
        
      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./android-app/package-lock.json
          
      - name: 配置 Java JDK (用于 Gradle 编译)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装项目依赖
        run: npm install

      - name: 生成原生代码引擎 (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 执行 Gradle 编译打包 (Release)
        working-directory: ./android-app/android
        run: ./gradlew assembleRelease

      - name: 上传 APK 文件供下载
        uses: actions/upload-artifact@v4
        with:
          name: jellyplayer-android-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
