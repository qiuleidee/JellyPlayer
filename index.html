<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JellyPlayer — 精美的 Jellyfin 影视播放前端" />
    <meta name="theme-color" content="#080810" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        var msg = e.message || e.error;
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:99999;background:red;color:white;padding:20px;font-size:14px;word-break:break-all;width:100%;height:100%;overflow:auto;"><h3>App Crashed!</h3>' + msg + '<br/><br/>' + (e.filename || '') + ':' + (e.lineno || '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason ? (e.reason.message || e.reason.stack || e.reason) : e;
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:99999;background:orange;color:white;padding:20px;font-size:14px;word-break:break-all;width:100%;height:100%;overflow:auto;"><h3>Unhandled Promise Rejection!</h3>' + msg + '</div>';
      });
    </script>
    <title>JellyPlayer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
